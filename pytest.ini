[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    e2e: prueba end-to-end contra el servidor realmente desplegado (HTTP + PostgreSQL reales). Opt-in, excluida por defecto. Ejecutar con: pytest -m e2e --no-cov
addopts =
    -ra
    --strict-markers
    -m "not e2e"
    --cov=app
    --cov-report=term-missing
    --cov-report=xml
    # Piso de cobertura en 90 % (la cobertura real ronda el 98 %) para que un retroceso de
    # cobertura falle el build.
    --cov-fail-under=90

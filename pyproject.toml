[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tasks-api-clean-architecture"
version = "0.1.0"
description = "API REST de gestión de listas de tareas con FastAPI y arquitectura limpia (hexagonal)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fakeredis>=2.21",
    "flake8>=7.0",
    "black>=24.4",
    "isort>=5.13",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
# SQLAlchemy async ejecuta el puente sync de la DBAPI dentro de greenlets, y FastAPI corre
# las dependencias síncronas (y `asyncio.to_thread`) en hilos del threadpool; sin rastrear
# ambos, coverage marca como "no cubiertas" líneas que sí se ejecutan en los tests.
concurrency = ["greenlet", "thread"]

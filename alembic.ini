# Configuración de Alembic. La URL de la base de datos NO se fija aquí: `migrations/env.py`
# la lee de la variable de entorno `DATABASE_URL` (la misma que usa la app), de modo que
# las migraciones no dependen de otros secretos (p. ej. JWT_SECRET_KEY).
[alembic]
script_location = migrations
prepend_sys_path = .
# Permite nombrar los archivos de versión con fecha + slug legible.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Tras GENERAR una migración (revision/--autogenerate), se formatea y ordena con el MISMO
# toolchain que las puertas de calidad: isort → black → ruff --fix. Así cada archivo nace
# conforme (orden de imports, longitud de línea, sin imports sin usar) y `ruff check .` /
# `isort --check` / `black --check` —que en CI cubren todo el repo, migraciones incluidas—
# no fallan por un archivo recién autogenerado. isort y black leen su config de
# pyproject.toml (line-length 100); ruff aplica I001/F401. Ver DECISION_LOG ADR-19 y ADR-23.
[post_write_hooks]
hooks = isort, black, ruff
isort.type = console_scripts
isort.entrypoint = isort
isort.options = REVISION_SCRIPT_FILENAME
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
